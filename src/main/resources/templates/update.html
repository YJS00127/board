<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
    <link rel="Stylesheet" th:href="@{/css/button.css}">
    <link rel="Stylesheet" th:href="@{/css/board.css}">
</head>
<body>
<div class="update-board-title">
    <h1>게시글 수정</h1><br>
</div>
<a class="a-btn" href="/board">목록</a>
<div class="update-board">
    <div class="update-title-writer">
        <label for="title">제목</label>
        <input type="text" id="title" class="update-title"
               placeholder="제목을 입력해주세요.">
        <label for="writer">작성자</label>
        <input type="text" id="writer" class="update-writer"
               placeholder="작성자를 입력해주세요.">
    </div>
    <div>
        <label for="content">내용</label>
        <textarea id="content" class="update-content"
                  placeholder="내용을 입력해주세요."></textarea>
    </div>
    <div>
        <label for="update-file">첨부파일</label>
        <input type="file" id="update-file" multiple>
    </div>
</div>
<div>
    <a class ="a-btn" onclick=updateCancel()>취소</a>
    <button class ="a-btn-first" onclick=updateContent()>수정</button>
</div>
<script src="/js/update.js"></script>
</body>
</html>
