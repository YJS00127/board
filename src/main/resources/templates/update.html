<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
</head>
<body>
    <h1>게시글 수정</h1>
    <a style="float: right;"
       th:href="@{/board}">목록</a>
    <form th:action="@{/board/{id}(id=${boardDetail.id})}"
          method="post">

        <input type="hidden" name="_method" value="put">

        <label for="title">제목</label>
        <input type="text" id="title" name="title"
               th:value="${boardDetail.title}" required><br>
        <label for="writer">작성자</label>
        <input type="text" id="writer" name="writer"
               th:value="${boardDetail.writer}" required><br>
        <label for="content">내용</label>
        <input type="text" id="content" name="content"
               th:value="${boardDetail.content}" required><br>
        <div style="float: right">
            <button>저장</button>
            <a th:href="@{/board/detail/{id}(id=${boardDetail.id})}">취소</a>
        </div>
    </form>
</body>
</html>
