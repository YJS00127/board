<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
</head>
<body>
    <h1>게시글 수정</h1>
    <button type="submit" style="float: right;"
            onclick="location.href='/board/list'">목록</button>
    <form role="form" th:object="${boardDTO}"
          th:action="@{/board/update}" method="post">
        <div>
            <label for="title">제목</label>
            <input type="text" id="title" name="title"
                   th:value="${boardDetail.title}">
        </div>
        <div>
            <label for="writer">작성자</label>
            <input type="text" id="writer" name="writer"
                   th:value="${boardDetail.writer}">
        </div>
        <div>
            <label for="content">내용</label>
            <input type="text" id="content" name="content"
                   th:value="${boardDetail.content}">
        </div>
        <div>
            <label for="pw">비밀번호 확인</label>
            <input type="text" id="pw" name="pw"
                   th:value="${boardDetail.pw}"
                   placeholder="확인용 비밀번호를 입력하세요.">
        </div>
        <div style="float: right">
            <input type="hidden" name="id" th:value="${boardDetail.id}">
            <input type="submit" th:value="저장">
            <button onclick="location.href='board/detail/{id}'">취소</button>
        </div>
    </form>
</body>
</html>
