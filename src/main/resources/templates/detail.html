<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상세 게시글</title>
    <link rel="Stylesheet" th:href="@{/css/button.css}">
    <link rel="Stylesheet" th:href="@{/css/board.css}">
</head>
<body>
<h1 class="detail-board-title">상세 게시글</h1>
<a class="a-btn" href="/board">목록</a>
<div>
    <div class="detail-board">
        <div class="detail-writer-createdAt-row">
            <p>작성자</p>
            <span class="detail-writer"></span>
            <p>등록일</p>
            <span class="detail-created-at"></span>
        </div>
        <div class="detail-title-viewCount-row">
            <p>제목</p>
            <span class="detail-title"></span>
            <p>조회수</p>
            <span class="detail-view-count"></span>
        </div>
        <div class="detail-content-row">
            <p>내용</p>
            <span class="detail-content"></span>
        </div>
        <div class="detail-file-row">
            <p>첨부파일</p>
            <div class="detail-file-list"></div>
        </div>
    </div><br>
    <div id="detailBtn">
        <button class="a-btn" type="button" onclick=pwChk('delete')>삭제</button>
        <button class="a-btn-first" type="button" onclick=pwChk('updatePwChk')>수정</button>
    </div>
</div>
<script src="/js/detail.js"></script>
</body>
</html>
