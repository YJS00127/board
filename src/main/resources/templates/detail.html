<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상세 게시글</title>
    <link rel="Stylesheet" th:href="@{/css/board.css}">
</head>
<body>
    <h1>상세 게시글</h1>
    <a class="a-btn" href="/board">목록</a>
<form id="boardDetailContents">
    <div>
        <h3>제목</h3>
        <p th:text="${boardDetail.title}"></p>
    </div>
    <div>
        <h3>작성자</h3>
        <p th:text="${boardDetail.writer}"></p>
    </div>
    <div>
        <h3>내용</h3>
        <p th:text="${boardDetail.content}"></p>
    </div>
    <div>
        <h3>작성일자</h3>
        <p th:text="${#temporals.format(boardDetail.createdAt, 'yyyy.MM.dd | HH:mm')}"></p>
    </div>


    <div id="pwChk">
        <button class="a-btn" type="button" th:onclick="|pwChk('updatePwChk', ${boardDetail.id})|">수정</button>
        <button class="a-btn" type="button" th:onclick="|pwChk('delete', ${boardDetail.id})|">삭제</button>
    </div>
</form>
    <script src="/js/board.js"></script>
</body>
</html>
