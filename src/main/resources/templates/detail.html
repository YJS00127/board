<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상세 게시글</title>
    <link rel="Stylesheet" th:href="@{/css/button.css}">
    <link rel="Stylesheet" th:href="@{/css/board.css}">
</head>
<body>
    <h1 class="boardDetail-title">상세 게시글</h1>
    <a class="a-btn" href="/board">목록</a>
    <div class="boardDetailBody">
        <p class="detail-writer"></p>
        <h3 class="detail-title"></h3>
        <div>
            <p class="detail-content"></p>
        </div>
        <div class = "viewCount-createdAt">
            <div class="detail-viewCount">
                <p>조회수  : </p>
                <p class="detail-view-count"></p>
            </div>
            <div class="detail-createdAt">
                <p>작성일  :  </p>
                <p class="detail-created-at"></p>
            </div>
        </div>
    </div>
    <div class="pwChk">
        <button class="a-btn" type="button" onclick=pwChk('delete')>삭제</button>
        <button class="a-btn-first" type="button" onclick=pwChk('updatePwChk')>수정</button>
    </div>
    <script src="/js/detail.js"></script>
</body>
</html>
