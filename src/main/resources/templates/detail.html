<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상세 게시글</title>
    <link rel="Stylesheet" th:href="@{/css/button.css}">
    <link rel="Stylesheet" th:href="@{/css/board.css}">
</head>
<body>
<h1 class="boardDetail-title">상세 게시글</h1>
<a class="a-btn" href="/board">목록</a>
<div>
    <table>
        <tr>
            <th>작성자</th>
            <td class="detail-writer"></td>
            <th>등록일</th>
            <td class="detail-created-at"></td>
        </tr>
        <tr>
            <th>제목</th>
            <td class="detail-title"></td>
            <th>조회수</th>
            <td class="detail-view-count"></td>
        </tr>
        <tr>
            <th>내용</th>
            <td colspan="3" class="detail-content"></td>
        </tr>
        <tr>
            <th>첨부파일</th>
            <td colspan="3" class="detail-files"></td>
        </tr>
    </table><br>
    <div id="detailBtn">
        <button class="a-btn" type="button" onclick=pwChk('delete')>삭제</button>
        <button class="a-btn-first" type="button" onclick=pwChk('updatePwChk')>수정</button>
    </div>
</div>
<script src="/js/detail.js"></script>
</body>
</html>
