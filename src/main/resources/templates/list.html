<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판 목록</title>
    <link rel="Stylesheet" th:href="@{/css/boardList.css}">
    <link rel="Stylesheet" th:href="@{/css/button.css}">
</head>
<body>
<a class="boardList" href="/board">
    <h1>게시판 목록</h1>
</a>
<div>
    <a class="a-btn" href="/board/insert">등록</a>
    <select id="category" class="category">
        <option value="title">제목</option>
        <option value="writer">작성자</option>
    </select>
    <input class="search" id="search-input" type="text" name="keyword" placeholder="검색어를 입력하세요"/>
    <button class="search-btn" id="search-btn" onclick=searchBtnClick()>검색</button>
</div>
<br>
<table>
    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성자</th>
        <th>조회수</th>
        <th>등록일</th>
        <th>등록시간</th>
    </tr>
    </thead>
    <tbody id="boardListOutPut">
    </tbody>
</table>
<div class="pagination-container">
    <div class="prev-pageGroup-button"><</div>
    <div class="prev-page-button">이전</div>
    <div class="number-button-wrapper"><span class="number-button">1</span></div>
    <div class="next-page-button">다음</div>
    <div class="next-pageGroup-button">></div>
</div>

<script src="/js/list.js"></script>
</body>
</html>
