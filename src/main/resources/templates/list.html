<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판 목록</title>
    <link rel="Stylesheet" th:href="@{/css/board.css}">
</head>
<body>
    <h1>게시판 목록</h1>
    <div style="float: right;">
        <button style="float: right;" onclick="location.href='/board/insert'">등록</button>
    </div>
    <form th:action="@{/board/list}" method="get">
        <input type="text" name="keyword" placeholder="제목을 검색하세요">
        <button type="submit">검색</button>
    </form>
    <div th:if="${#lists.isEmpty(boardList)}">
        <h2>등록된 게시글이 없습니다.</h2>
    </div>
    <br>
    <table th:if="${!#lists.isEmpty(boardList)}">
        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
            <th>작성시간</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="boardData, stat :${boardList}">
            <td th:text="${stat.count}"></td>
            <td>
            <a th:href="@{/board/detail/{id}(id=${boardData.id})}"
                th:text="${boardData.title}"></a>
            </td>
            <td th:text="${boardData.writer}"></td>
            <td th:text="${#temporals.format(boardData.createdAt, 'yyyy.MM.dd')}"></td>
            <td th:text="${#temporals.format(boardData.createdAt, 'HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
</body>
</html>
