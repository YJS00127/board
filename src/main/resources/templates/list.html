<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판 목록</title>
    <link rel="Stylesheet" th:href="@{/css/board.css}">
</head>
<body>
<a class="boardList" href="/board">
    <h1>게시판 목록</h1>
</a>
<div>
    <a class="a-btn" href="/board/insert">등록</a>
    <input class="search" id="search-input" type="text" name="keyword" placeholder="검색어를 입력하세요"/>
</div>
<br>
<table>
    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성자</th>
        <th>작성일</th>
        <th>작성시간</th>
    </tr>
    </thead>
    <tbody id="boardListOutPut">
    </tbody>
</table>
<div class="pagination-container">
    <div class="prev-button">이전</div>
    <div class="number-button-wrapper" id="number-button-wrapper"><span class="number-button">1</span></div>
    <div class="next-button">다음</div>
</div>

<script src="/js/list.js"></script>
</body>
</html>
