<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 작성</title>
</head>
<body>
    <div>
        <h1>게시글 작성</h1>
        <button style= "float:right;"  onclick="location.href='/board/list'">목록</button>
    </div>
    <div>
        <form role="form" th:object=${boardDTO} th:action="@{/board/insert}"
              method="post" enctype="multipart/form-data">
            <div>
                <label for="title">제목</label>
                <input type="text" th:field="*{title}" id="title" name="title"
                placeholder="제목을 입력하세요" required="required">
            </div>
            <div>
                <label for="writer">작성자</label>
                <input type="text" th:field="*{writer}" id="writer" name="writer"
                       placeholder="작성자를 입력하세요" required="required">
            </div>
            <div>
                <label for="content">내용</label>
                <input type="text" th:field="*{content}" id="content" name="content"
                       placeholder="내용을 입력하세요" required="required">
            </div>
            <div>
                <label for="pw">비밀번호</label>
                <input type="text" th:field="*{pw}" id="pw" name="pw"
                       placeholder="비밀번호를 입력하세요" required="required">
            </div>
            <div style="float:right;">
                <input type="submit" th:value="작성">
                <input type="reset" th:value="취소">
            </div>
        </form>
    </div>
    <div>
    </div>
</body>
</html>
