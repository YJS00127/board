<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 작성</title>
    <link rel="Stylesheet" th:href="@{/css/button.css}">
    <link rel="Stylesheet" th:href="@{/css/board.css}">
</head>
<body>
<div class="insert-title">
    <h1>게시글 작성</h1>
</div>
<a class="a-btn" href="/board">목록</a>
<form class="insert-board">
        <div>
            <label for="writer">작성자</label>
            <input type="text" id="writer" class="insert-writer"
                   placeholder="작성자를 입력하세요">
            <label for="createdAt">등록일</label>
            <p id="createdAt" class="insert-created-at"></p>
        </div>
        <div>
            <label for="title">제목</label>
            <input type="text" id="title" class="insert-title"
                   placeholder="제목을 입력하세요">
        </div>
        <div>
            <label for="content">내용</label>
            <textarea id="content" class="insert-content"
                      placeholder="내용을 입력하세요"></textarea>
        </div>
        <div>
            <label for="pw">비밀번호</label>
            <input type="password" id="pw" class="insert-pw"
                   placeholder="비밀번호를 입력하세요">
            <label for="pwConfirm">비밀번호 확인</label>
            <input type="password" id="pwConfirm" class="insert-pwConfrim"
                   placeholder="비밀번호를 한 번 더 입력하세요">
        </div>
        <div>
            <label for="file">첨부파일</label>
            <input type="file" id="file" class="insert-file" multiple>
        </div>
</form><br>
<button class ="a-btn" type="button" onclick=resetValue()>초기화</button>
<button class ="a-btn-first" type="button" onclick=insertContents()>등록</button>
<script src= '/js/insert.js'></script>
</body>
</html>
