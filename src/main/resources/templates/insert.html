<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 작성</title>
    <link rel="Stylesheet" th:href="@{/css/board.css}">
</head>
<body>
    <div>
        <h1>게시글 작성</h1>
        <a class="a-btn" href="/board">목록</a>
    </div>
    <div>
        <form role="form" th:object=${boardDTO} th:action="@{/board}"
              method="post" enctype="multipart/form-data">
            <label for="title">제목</label>
            <input type="text" id='title' name='title' th:value="${title}"
                   placeholder="제목을 입력하세요" required><br>
            <label for="writer">작성자</label>
            <input type="text" id="writer" name="writer" th:value="${writer}"
                   placeholder="작성자를 입력하세요" required><br>
            <label for="content">내용</label>
            <input type="text" id="content" name="content" th:value="${content}"
                   placeholder="내용을 입력하세요" required><br>
            <label for="pw">비밀번호</label>
            <input type="text" id="pw" name="pw" th:pw="${pw}"
                   placeholder="비밀번호를 입력하세요" required><br>
            <button class ="a-btn">등록</button>
            <button class ="a-btn" type="reset">초기화</button>
        </form>
    </div>
    <div>
    </div>
</body>
</html>
